shots:
  - type: broll
    narration: A dark five-gallon bucket can become the most useful mosquito trap on your property.
    visual: Handheld close-up moving toward a plain dark bucket half full of rainwater behind a weathered wooden garden shed.
  - type: still
    narration: It works by offering female mosquitoes an attractive place to lay their eggs.
    visual: Macro documentary view of a mosquito hovering just above still dark water inside a garden bucket, scientifically plausible anatomy.
  - type: presenter
    narration: The important part is ensuring those eggs never become biting adults.
  - type: broll
    narration: Place a dark bucket in shade, away from patios, doors, and play areas.
    visual: A person carries a plain black bucket across a rural garden and sets it in deep shade behind a hedge, face outside frame.
  - type: still
    narration: Fill it halfway with water and add grass clippings or dry leaves.
    visual: Top-down documentary photograph of a hand dropping loose grass clippings and dry leaves into a half-filled black bucket.
  - type: broll
    narration: Decomposing plants make the water resemble the sheltered pools mosquitoes naturally seek.
    visual: Slow handheld close-up across murky still bucket water with floating leaves and grass, natural reflections and no visible insects larger than life.
  - type: presenter
    narration: Because that water attracts breeding, it must never be left untreated.
  - type: still
    narration: Add a labelled BTI mosquito product, following its exact dose and replacement schedule.
    visual: Close documentary photograph of a generic unbranded spoon holding tan mosquito-control granules above a dark bucket, packaging deliberately out of frame.
  - type: broll
    narration: BTI targets mosquito larvae in water instead of spraying every garden insect.
    visual: Scientifically plausible macro underwater footage of mosquito larvae moving near the surface of still bucket water.
  - type: still
    narration: That distinction matters around flowers, bees, pets, and family spaces.
    visual: Honeybee visiting purple summer flowers in a modest garden, with a relaxed dog softly out of focus in the background.
  - type: presenter
    narration: One bucket is rarely enough for an entire property.
  - type: broll
    narration: Place several stations near hedges, sheds, rain barrels, and damp shaded corners.
    visual: Handheld walking shot through a rural property revealing separate dark buckets discreetly placed by a hedge, shed, and rain barrel.
  - type: still
    narration: Protect every station from children and animals while following the product instructions.
    visual: A securely positioned covered mosquito station in a fenced garden utility corner, inaccessible to a nearby child and dog in the distant background.
  - type: broll
    narration: Then inspect the property weekly and empty every accidental container holding rainwater.
    visual: First-person handheld footage tipping collected rainwater from a plant saucer onto gravel during a weekly garden inspection.
  - type: still
    narration: Saucers, tarps, gutters, toys, wheelbarrows, and tyres can all become breeding sites.
    visual: Wide documentary photograph of a slightly untidy garden utility area containing a wheelbarrow, folded tarp, plant saucer, old toy, gutter downpipe, and one tyre after rain.
  - type: presenter
    narration: A treated trap works best when competing water sources are removed.
  - type: broll
    narration: After heavy rain, empty unwanted water and refresh treated stations when their labels require it.
    visual: Overcast handheld garden footage after a storm as a person empties a small container, checks a dark bucket, and marks a maintenance date on a private notebook with no readable writing.
  - type: still
    narration: Avoid spraying open flowers while pollinators are active.
    visual: Close documentary photograph of flowering herbs covered with active bees while a pump garden sprayer remains safely stored in the distant background.
  - type: presenter
    narration: This is a routine aimed at the mosquito life cycle, not a one-time miracle.
  - type: broll
    narration: Check local guidance, review results weekly, and adjust placement before adding more chemicals.
    visual: Handheld final shot at sunset as a homeowner quietly moves one dark bucket farther behind a hedge and surveys the calm garden.
