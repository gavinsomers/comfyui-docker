    presenter: >-
      Canonical host wardrobe: simple natural straw hat, long dark beard, plain
      white collarless linen work shirt, and black suspenders. No modern jacket,
      plaid shirt, shorts, sweater, bucket hat, or wardrobe change. Keep the
      host's face outside frame in action B-roll.
    bucket: >-
      The only trap container is one matte dark-black plastic five-gallon
      bucket with straight cylindrical sides and one silver metal bail handle.
      Never show a white tub, galvanized pail, pale container, stock tank, or a
