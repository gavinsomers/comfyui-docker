presenter:
  mode: supplied
  image: basedir:input/video_factory/mosquito-control-pilot-v2/references/presenter-close.png
  seed: 509001
  animation_prompt: >-
    The exact fictional rural homesteader from the supplied canonical portrait
    remains in a chest-up composition. Preserve his face, long dark beard,
    simple natural straw hat, plain white collarless linen work shirt, black
    suspenders, room, lighting, and camera distance. Use restrained blinking,
    tiny head movements, and modest upper-face expression. Keep the lower face
    stable for the final audio-driven lip-sync pass. Locked-off camera, no cuts,
    no zoom, no hand gestures entering frame, no subtitles, no text, no logos,
    and no identity change.
  pipeline:
    motion_engine: liveportrait_motion
    lip_sync_engine: latentsync16_mouthrestore
    driving_asset: presenter_driving
    driving_frame_capacity: 100
    fps: 25
    lip_sync_options:
      mask: mask3
      inference_steps: 20
      guidance_scale: 1.5
      enable_deepcache: false
      pad_x: 11.0
      pad_y: 12.0
      minimum_radius_x: 37.0
      minimum_radius_y: 22.0
      feather_sigma: 4.0
  qa:
    sample_fps: 12
    minimum_mouth_motion_mean: 3.0
    minimum_mouth_motion_p95: 6.0
